plugins { id 'com.android.application' }

// El número de versión lo pone GitHub en cada compilación (-PversionCode=N); la app lo compara para avisar.
def codigo = (project.findProperty('versionCode') ?: '1') as int

android {
    namespace 'com.andresnb.hombrelobo.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.andresnb.hombrelobo.tv'
        minSdk 23
        targetSdk 35
        versionCode codigo
        versionName "1.${codigo - 1}"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('FIRMA_ARCHIVO') ?: 'sin-firma.p12')
            storePassword System.getenv('FIRMA_CLAVE')
            storeType 'pkcs12'
            keyAlias 'tv'
            keyPassword System.getenv('FIRMA_CLAVE')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}

dependencies { implementation 'androidx.core:core:1.13.1' }
